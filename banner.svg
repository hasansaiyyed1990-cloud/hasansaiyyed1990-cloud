<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 220" width="850" height="220" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#070b14"/>
    </linearGradient>

    <!-- Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>

    <!-- Glow filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>
    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
    </filter>
  </defs>

  <!-- Card Background -->
  <rect x="2" y="2" width="846" height="216" rx="16" fill="url(#bgGrad)"/>

  <!-- Ambient Glow Spots -->
  <circle cx="100" cy="30" r="110" fill="#0284c7" opacity="0.25" filter="url(#glowCyan)"/>
  <circle cx="750" cy="190" r="120" fill="#6366f1" opacity="0.25" filter="url(#glowPurple)"/>

  <!-- Border -->
  <rect x="2" y="2" width="846" height="216" rx="16" stroke="url(#borderGrad)" stroke-width="1.5" fill="none"/>

  <!-- Top Pill Badge -->
  <g transform="translate(295, 28)">
    <rect x="0" y="0" width="260" height="28" rx="14" fill="#0c2340" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5"/>
    <circle cx="16" cy="14" r="4" fill="#38bdf8"/>
    <text x="30" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#38bdf8" letter-spacing="1.5">FULL STACK DEVELOPER</text>
  </g>

  <!-- Main Name Title -->
  <text x="425" y="112" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="42" font-weight="900" fill="url(#textGrad)" letter-spacing="2">HASAN SAIYYED</text>

  <!-- Decorative Separator Line -->
  <g transform="translate(275, 134)">
    <line x1="0" y1="0" x2="300" y2="0" stroke="url(#accentGrad)" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Subtitle Line 1: Primary Skills -->
  <text x="425" y="165" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#cbd5e1" letter-spacing="0.5">
    ☕ Java &amp; Spring Boot  •  ⚛️ React.js &amp; TypeScript  •  🎨 Tailwind CSS &amp; Vite
  </text>

  <!-- Subtitle Line 2: Focus & Arch -->
  <text x="425" y="192" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">
    Microservices  |  RESTful APIs  |  PostgreSQL &amp; MySQL  |  Cloud Architecture
  </text>
</svg>
